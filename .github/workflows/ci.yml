name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create mock .env file for CI
      run: |
        echo "POSTGRES_USER=test_admin" >> .env
        echo "POSTGRES_PASSWORD=test_password" >> .env
        echo "REDIS_PASSWORD=test_redis" >> .env

    - name: Build and start Docker containers
      run: docker compose up --build -d

    - name: Check if containers are running successfully
      run: docker ps -a

    - name: Stop and clean up containers
      if: always()
      run: docker compose down
